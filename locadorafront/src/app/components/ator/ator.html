<div class="container">

  <h1>Cadastro de Ator</h1>

  <form (ngSubmit)="salvar()">

    <div class="campo">
      <label for="nome">Nome:</label>

      <input
        type="text"
        id="nome"
        name="nome"
        [(ngModel)]="nome"
        placeholder="Digite o nome do ator"
        required
      >
    </div>

    <button type="submit">
      Salvar
    </button>

  </form>

  

</div>
